name: Update PSX data

on:
  schedule:
    - cron: "*/30 4-10 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psx-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python psx_fetch.py
      - name: Save data.json
        run: |
          git config user.name "psx-bot"
          git config user.email "psx-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update PSX data" && git push)
